<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register | eFootball League</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">eFootball League</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="#">Tournaments</a>
        <a href="#">Leagues</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<section class="login-container">

    <div class="login-box">
        <h2>Create Account</h2>

        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button onclick="registerUser()">Register</button>

        <p id="message"></p>

        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>

</section>

<footer>
    <p>© 2026 eFootball League. All Rights Reserved.</p>
</footer>

<script>
function registerUser() {
    let username = document.getElementById("username").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let message = document.getElementById("message");

    if (username === "" || email === "" || password === "") {
        message.style.color = "red";
        message.innerText = "Please fill in all fields";
        return;
    }

    if (username.length < 5) {
        message.style.color = "red";
        message.innerText = "Username too short";
        return;
    }

    if (!email.includes("@")) {
        message.style.color = "red";
        message.innerText = "Enter a valid email";
        return;
    }

    if (password.length < 8) {
        message.style.color = "red";
        message.innerText = "Password too weak";
        return;
    }

    // ✅ REGISTER SUCCESS
    message.style.color = "#00ff88";
    message.innerText = "Account created successfully! Redirecting...";

    // 🔐 SAVE LOGIN STATE (auto-login after register)
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("username", username);

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1500);
}
</script>

</body>
</html
